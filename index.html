<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomads Bar Menu</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent: #c5a059; /* Urbane Bronze inspired gold accent */
            --text: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .drink-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid var(--accent);
        }
        .drink-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .drink-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .drink-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }
        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        .tier-list {
            margin-top: 20px;
        }
        .tier-item {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
        .tier-label {
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

<header>
    <h1>NOMADS</h1>
    <p style="color: var(--text-muted);">Select a classic drink to customize your pour</p>
</header>

<div class="menu-grid" id="menuGrid"></div>

<!-- Customization Modal -->
<div class="modal" id="drinkModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalDrinkName" style="color: var(--accent); margin-top: 0;"></h2>
        <p id="modalRecipe" style="font-style: italic; margin-bottom: 20px;"></p>
        
        <h3>Choose Your Pour:</h3>
        <div class="tier-list" id="modalTiers"></div>
    </div>
</div>

<script>
// Menu configuration pulling completely from your current on-hand bar stock
const menuData = [
    {
        name: "Old Fashioned",
        recipe: "2 oz Whiskey, 1 tsp Simple Syrup, 2-3 dashes Angostura Bitters. Stirred on ice, orange twist garnish.",
        tiers: [
            { label: "Well", brand: "Maker's Mark" },
            { label: "Call", brand: "Michter's" },
            { label: "Top Shelf", brand: "Woodford Reserve" }
        ]
    },
    {
        name: "Whiskey Sour",
        recipe: "2 oz Whiskey, 3/4 oz Fresh Lemon Juice, 3/4 oz Simple Syrup. Shaken with ice, strained clean.",
        tiers: [
            { label: "Well", brand: "Bulleit Bourbon" },
            { label: "Call", brand: "Michter's" },
            { label: "Top Shelf", brand: "WhistlePig 10 Year" }
        ]
    },
    {
        name: "Rusty Nail",
        recipe: "1.5 oz Scotch Whisky, 3/4 oz Drambuie. Built over ice in a rocks glass and stirred gently.",
        tiers: [
            { label: "Well", brand: "Johnnie Walker Red" },
            { label: "Call", brand: "Dewar's White Label" },
            { label: "Top Shelf", brand: "Premium House Blend" }
        ]
    },
    {
        name: "Margarita",
        recipe: "2 oz Tequila, 1 oz Fresh Lime Juice, 3/4 oz Triple Sec/Orange Liqueur, 1/4 oz Agave. Salt rim.",
        tiers: [
            { label: "House Pour", brand: "Jose Cuervo" }
        ]
    },
    {
        name: "Rum Highball",
        recipe: "2 oz Rum, topped with Cola or Ginger Beer, served over ice with a fresh lime wedge.",
        tiers: [
            { label: "Spiced", brand: "Captain Morgan" },
            { label: "Tropical", brand: "Malibu" }
        ]
    }
];

const menuGrid = document.getElementById('menuGrid');
const modal = document.getElementById('drinkModal');

// Render the Main Menu Dashboard
menuData.forEach((drink, index) => {
    const card = document.createElement('div');
    card.className = 'drink-card';
    card.onclick = () => openModal(index);
    card.innerHTML = `
        <div class="drink-name">${drink.name}</div>
        <div class="drink-desc">${drink.recipe}</div>
    `;
    menuGrid.appendChild(card);
});

function openModal(index) {
    const drink = menuData[index];
    document.getElementById('modalDrinkName').innerText = drink.name;
    document.getElementById('modalRecipe').innerText = drink.recipe;
    
    const tierContainer = document.getElementById('modalTiers');
    tierContainer.innerHTML = '';
    
    drink.tiers.forEach(t => {
        tierContainer.innerHTML += `
            <div class="tier-item">
                <span class="tier-label">${t.label}</span>
                <span>${t.brand}</span>
            </div>
        `;
    });
    
    modal.style.display = 'flex';
}

function closeModal() {
    modal.style.display = 'none';
}

// Close if clicked outside content box
window.onclick = function(event) {
    if (event.target == modal) {
        closeModal();
    }
}
</script>
</body>
</html>
